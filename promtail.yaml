server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Fraud Detection Service Logs
  - job_name: fraud-detection
    static_configs:
      - targets:
          - localhost
        labels:
          job: fraud-detection
          service_name: fraud_detection
          __path__: /logs/fraud_detection/*.log

    pipeline_stages:
      - json:
          expressions:
            ts: ts
            level: level
            service: service
            msg: msg

      - labels:
          level:
          service:

      - timestamp:
          source: ts
          format: RFC3339

  # Payment Service Logs
  - job_name: payment-service
    static_configs:
      - targets:
          - localhost
        labels:
          job: payment-service
          service_name: payment_service
          __path__: /logs/payment_service/*.log

    pipeline_stages:
      - json:
          expressions:
            ts: ts
            level: level
            service: service
            msg: msg

      - labels:
          level:
          service:

      - timestamp:
          source: ts
          format: RFC3339